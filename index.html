<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="color-scheme" content="light">
  <meta name="description" content="IFPI Campus Parnaíba: filme animado de 25 segundos: caderno de campo, topografia, ponte 3D, capacete, efeitos e assinatura caligráfica.">
  <title>IFPI · Parnaíba — Uma obra entre a engenharia e a poesia</title>
  <style>
    :root{--paper:#f4f1e8;--graphite:#26302e;--ifgreen:#329846;--ifred:#cd1425}
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%;height:100dvh;width:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--graphite)}
    body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
    #scene{position:absolute;inset:0;width:100%;height:100%;display:block}
    .film{position:absolute;inset:0;pointer-events:none;overflow:hidden;isolation:isolate}
    .film::before{content:"";position:absolute;inset:-12%;z-index:0;background:radial-gradient(ellipse at 48% 40%,transparent 36%,rgba(81,71,52,.055) 88%);pointer-events:none}
    .film::after{content:"";position:absolute;inset:0;z-index:12;opacity:.13;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.13) 3px 4px);mix-blend-mode:soft-light}
    /* Arte original em SVG: um capacete de segurança industrial, visto em três quartos. */
    #helmet{position:absolute;z-index:4;left:0;top:0;width:var(--helmet-width,270px);aspect-ratio:640/450;opacity:0;transform-origin:50% 64%;will-change:transform,opacity;pointer-events:none}
    #helmet svg{display:block;width:100%;height:100%;overflow:visible}
    #helmet .ink{stroke:#4c5553;stroke-linecap:round;stroke-linejoin:round}
    #helmet .ink-outline{fill:none;stroke:#4c5753;stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1150;stroke-dashoffset:1150;opacity:.77}
    #helmet .ink-rib{fill:none;stroke:#34423e;stroke-width:2;stroke-linecap:round;stroke-dasharray:620;stroke-dashoffset:620;opacity:.35}
    #helmet .helmet-paint{opacity:0}
    #helmet .specular{opacity:0}
    #helmet .helmet-ribs{opacity:0}
    #helmet .sketch-shade{opacity:0}
    #helmet.illustrated .ink-outline{animation:trace .94s cubic-bezier(.2,.65,.23,1) both}
    #helmet.illustrated .ink-rib{animation:trace .7s .22s cubic-bezier(.2,.65,.23,1) both}
    #helmet.illustrated .helmet-paint{animation:colorIn .87s .45s ease-out both}
    #helmet.illustrated .helmet-ribs{animation:colorIn .78s .61s ease-out both}
    #helmet.illustrated .sketch-shade{animation:colorIn .85s .65s ease-out both}
    #helmet.illustrated .specular{animation:colorIn 1.1s .9s ease-out both}
    @keyframes trace{from{stroke-dashoffset:1150}to{stroke-dashoffset:0}}
    @keyframes colorIn{from{opacity:0}to{opacity:1}}
    #identity{position:absolute;z-index:6;left:50%;top:54%;transform:translateX(-50%);width:min(92vw,510px);text-align:center;pointer-events:none;opacity:0}
    #identity .institution{display:block;margin:0;font-family:"Caveat","Segoe Print",cursive;font-weight:700;font-size:clamp(27px,8vw,46px);line-height:.97;color:#22312a;letter-spacing:-.025em}
    #identity .campus{display:block;margin-top:4px;font-family:"Caveat","Segoe Print",cursive;font-weight:600;font-size:clamp(24px,6.3vw,37px);line-height:1.02;color:#187e43}
    #identity .separator{width:0;height:1.8px;margin:12px auto 9px;background:linear-gradient(90deg,transparent,#17854d 15%,#9ab79b 80%,transparent);opacity:0;transform-origin:left center}
    #identity .signature{display:block;margin:0;font-family:"Nothing You Could Do","Segoe Print", "Bradley Hand",cursive;font-size:clamp(16px,4.5vw,23px);line-height:1.22;letter-spacing:-.045em;color:#333c33}
    #identity .course{display:block;margin:2px 0 0;font-family:"Caveat","Segoe Print",cursive;font-weight:500;font-size:clamp(17px,4.5vw,24px);line-height:1;color:#5d6859}
    .visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    #identity .hand-svg{display:block;height:auto;margin-inline:auto;overflow:visible;fill:currentColor}
    #identity .institution .hand-svg{width:min(100%,375px)}
    #identity .campus .hand-svg{width:min(82%,273px)}
    #identity .signature .hand-svg{width:min(78%,224px)}
    #identity .course .hand-svg{width:min(64%,190px)}
    @media (orientation:landscape) and (max-height:550px){#identity .hand-svg{margin-left:0!important}}
    #identity .reveal{opacity:0;clip-path:inset(0 100% 0 0);will-change:clip-path,opacity}
    .still{position:absolute;z-index:9;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:var(--paper)}
    .still .logo{width:clamp(105px,29vw,156px);height:auto;margin-bottom:18px}
    .still .institution{font:700 clamp(29px,8vw,42px)/1 "Caveat","Segoe Print",cursive}
    .still .campus{font:600 clamp(24px,6vw,36px)/1.05 "Caveat","Segoe Print",cursive;color:#168345}
    .still .signature{margin-top:16px;font:clamp(17px,4.5vw,23px)/1.3 "Nothing You Could Do","Segoe Print",cursive}
    .still .course{margin-top:12px;font:500 clamp(17px,4vw,23px)/1.1 "Caveat","Segoe Print",cursive}

    .still .hand-svg{display:block;height:auto;margin-inline:auto;fill:currentColor;overflow:visible}
    .still .institution .hand-svg{width:min(100%,375px)}
    .still .campus .hand-svg{width:min(82%,273px)}
    .still .signature .hand-svg{width:min(78%,224px)}
    .still .course .hand-svg{width:min(64%,190px)}
    @media (orientation:landscape) and (max-height:550px){.still .hand-svg{margin-left:0}}
    body.static #scene,body.static #helmet,body.static #identity{display:none}
    body.static .still{display:flex}
    @media (orientation:landscape) and (max-height:550px){
      #identity{top:50%;left:51%;transform:translateY(-50%);width:45%;text-align:left}
      #identity .institution{font-size:clamp(25px,5.1vh,40px)}
      #identity .campus{font-size:clamp(23px,5.1vh,35px)}
      #identity .signature{font-size:clamp(16px,4vh,22px)}
      #identity .course{font-size:clamp(16px,3.8vh,22px)}
      #identity .separator{margin:9px 0 8px}
      .still{flex-direction:row;gap:30px;text-align:left}.still .logo{margin:0}
    }
    @media (prefers-reduced-motion:reduce){body:not(.static) #scene,body:not(.static) #helmet,body:not(.static) #identity{display:none}body:not(.static) .still{display:flex}}
  </style>

  <style id="art-direction-v4">
    :root{--paper:#f5f2e9;--graphite:#24312e;--ifgreen:#329846;--ifred:#c8102e}
    #helmet{aspect-ratio:1000/704;overflow:visible;filter:drop-shadow(0 9px 12px rgba(28,35,32,.12))}
    #helmet .helmet-draft,#helmet .helmet-render{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
    #helmet .helmet-draft{opacity:1;filter:contrast(1.25) saturate(.35)}
    #helmet .helmet-render{opacity:0;filter:contrast(1.03) saturate(.82);clip-path:inset(0 100% 0 0)}
    #helmet.illustrated .helmet-draft{animation:pencilOut 1.25s .58s ease-in-out both}
    #helmet.illustrated .helmet-render{animation:paintMaterialize 1.35s .38s cubic-bezier(.2,.7,.22,1) both}
    #helmet .helmet-cast-shadow{position:absolute;left:11%;bottom:-2%;width:74%;height:13%;background:radial-gradient(ellipse,rgba(32,43,39,.26),rgba(32,43,39,.06) 49%,transparent 75%);filter:blur(13px);transform:rotate(-6deg)}
    #helmet .helmet-glimmer{position:absolute;inset:4% 2% 18%;clip-path:polygon(3% 0,34% 0,11% 100%,0 100%);background:linear-gradient(104deg,transparent 25%,rgba(255,255,255,.32) 49%,transparent 73%);mix-blend-mode:screen;opacity:0}
    #helmet.illustrated .helmet-glimmer{animation:glimmer 1.25s .78s ease-out both}
    @keyframes pencilOut{0%{opacity:0}20%{opacity:.83}45%{opacity:.88}100%{opacity:0}}
    @keyframes paintMaterialize{0%{opacity:0;clip-path:inset(0 100% 0 0);filter:grayscale(1) contrast(2)}30%{opacity:.75;clip-path:inset(0 50% 0 0);filter:grayscale(.5) contrast(1.4)}100%{opacity:1;clip-path:inset(0 0 0 0);filter:grayscale(0) contrast(1.03)}}
    @keyframes glimmer{0%,16%{opacity:0;transform:translateX(-70%) skewX(-10deg)}40%{opacity:.38}88%,100%{opacity:0;transform:translateX(140%) skewX(-10deg)}}
    .film::before{background:radial-gradient(ellipse at 56% 47%,transparent 30%,rgba(56,48,38,.064) 85%)}
    .film::after{opacity:.085}
    #identity{width:min(94vw,490px);z-index:6;filter:drop-shadow(0 1px 1px rgba(48,66,54,.06))}
    #identity .identity-inner{width:100%;display:flex;flex-direction:column;align-items:center;gap:0}
    #identity .reveal{display:block;max-width:100%;margin-inline:auto;opacity:0;clip-path:inset(0 100% 0 0);transform:rotate(-.45deg)}
    #identity .institution{font-size:inherit;line-height:normal;letter-spacing:normal; color:#273630}
    #identity .campus{font-size:inherit;line-height:normal;letter-spacing:normal;color:#14814a;margin-top:1px;transform:rotate(.35deg)}
    #identity .signature{font-size:inherit;line-height:normal;letter-spacing:normal;color:#283732;margin-top:5px;transform:rotate(-1.4deg)}
    #identity .course{font-size:inherit;line-height:normal;letter-spacing:normal;color:#657167;margin-top:-1px;transform:rotate(.5deg)}
    #identity .hand-svg{margin:0 auto;display:block;max-width:100%;height:auto;overflow:visible;filter:url(#roughInk)}
    #identity .institution .hand-svg{width:min(92vw,350px)}
    #identity .campus .hand-svg{width:min(75vw,260px)}
    #identity .signature .hand-svg{width:min(79vw,295px)}
    #identity .course .hand-svg{width:min(62vw,212px)}
    #identity .separator{height:1px;margin:5px auto 6px;transform:rotate(-1deg)}
    #identity .signature::after{content:"";display:block;margin:-8px auto 0;width:75%;height:13px;border-bottom:1.35px solid rgba(44,69,55,.45);border-radius:50%;transform:rotate(-4deg);opacity:.7}
    .still{background:var(--paper);color:#26332c}
    .still .logo{width:min(27vw,118px);height:auto;margin-bottom:22px}
    .still .still-inner{display:flex;flex-direction:column;align-items:center}
    .still .institution,.still .campus,.still .signature,.still .course{font-family:"Z003","URW Chancery L",cursive;font-style:italic;font-weight:400}
    .still .institution{font-size:clamp(26px,7vw,42px)}
    .still .campus{font-size:clamp(24px,6.8vw,40px)}
    .still .signature{font-size:clamp(27px,7vw,42px);margin-top:16px}
    .still .course{font-size:clamp(22px,5vw,30px);margin-top:2px}
    @media(orientation:landscape) and (max-height:550px){
      #identity{width:47%;left:51%}
      #identity .identity-inner{align-items:flex-start}
      #identity .reveal,#identity .hand-svg{margin-left:0}
      #identity .institution .hand-svg{width:min(43vw,340px)}
      #identity .campus .hand-svg{width:min(32vw,245px)}
      #identity .signature .hand-svg{width:min(34vw,278px)}
      #identity .course .hand-svg{width:min(26vw,194px)}
      #identity .separator{margin-left:0}
      #identity .signature::after{margin-left:0}
      .still{flex-direction:row;gap:18px}
      .still .still-inner{align-items:flex-start}
    }
    @media(prefers-reduced-motion:reduce){#helmet .helmet-render,#helmet .helmet-draft{animation:none}}
  </style>
<style id="organic-pen-ink">
#identity .signature .hand-svg{width:min(86vw,332px);height:auto;filter:drop-shadow(.4px .2px .1px rgba(35,56,44,.13))}
#identity .signature-art .ink-path{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.93}
#identity .signature::after{display:none}
#identity .signature{margin-top:8px;margin-bottom:5px}
@media(orientation:landscape) and (max-height:550px){#identity .signature .hand-svg{width:min(37vw,320px)}}
</style></head>

  </section>
  <script>
  (function(){
    "use strict";
    /* Relógio incondicional: não depende do Canvas, das fontes, do SVG nem da GPU. */
    const DESTINO="https://suap.ifpi.edu.br/",DURACAO=25000;
    let navegou=false;
    function navegar(){if(navegou)return;navegou=true;window.location.href=DESTINO;}
    const inicio=performance.now();
    window.setTimeout(navegar,DURACAO);

    const cv=document.getElementById("scene"),hc=document.getElementById("helmet"),identity=document.getElementById("identity");
    const ctx=cv.getContext&&cv.getContext("2d",{alpha:false,desynchronized:false});
    const reduzir=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!ctx||reduzir){document.body.classList.add("static");return;}
    hc.classList.add("illustrated");

    const PI=Math.PI,TAU=2*PI,CELLS=[[0,0],[1,0],[2,0],[0,1],[1,1],[0,2],[1,2],[2,2],[0,3],[1,3]];
    const random=(n)=>{const x=Math.sin(n*127.1+73.3)*43758.5453;return x-Math.floor(x);};
    const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
    const mix=(a,b,t)=>a+(b-a)*t;
    const smooth=(a,b,t)=>{let s=clamp((t-a)/(b-a));return s*s*(3-2*s);};
    const ease=(x)=>1-Math.pow(1-clamp(x),3);
    const easeInOut=(x)=>{const q=clamp(x);return q<.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;};
    const fmt=(x)=>Math.round(x);
    const ink="#354541",guide="#21804d",paper="#f5f2e9";
    let W=390,H=844,ratio=1,land=false,sym={x:0,y:0,unit:32,gap:8,w:112,h:150},grid=[],BG=null;
    let yaw=-.12,pitch=.1,distance=16.6,focal=620,eye={x:0,y:0};
    let members=[],sections=[],shardData=[],dust=[];
    let frameNo=0,done=false;

    function resize(){
      W=Math.max(240,window.innerWidth||390);H=Math.max(250,window.innerHeight||844);land=W/H>1.18;
      ratio=Math.max(1,Math.min(window.devicePixelRatio||1,2.5,Math.sqrt(8000000/(W*H))));
      cv.width=Math.round(W*ratio);cv.height=Math.round(H*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);
      const unit=land?clamp(H*.110,27,44):clamp(Math.min(W*.125,H*.058),26,49),gap=unit*.22;
      const ww=unit*3+gap*2,hh=unit*4+gap*3;
      const centerX=land?W*.30:W*.5,centerY=land?H*.485:H*.370;
      sym={x:centerX-ww/2,y:centerY-hh/2,unit:unit,gap:gap,w:ww,h:hh};
      grid=CELLS.map(([c,r])=>({x:sym.x+c*(unit+gap)+unit/2,y:sym.y+r*(unit+gap)+unit/2,c,r}));
      identity.style.top=land?"50%":Math.min(H*.77,sym.y+hh+Math.max(12,H*.016))+"px";
      const hw=land?clamp(H*.78,210,310):clamp(W*.90,265,390);
      hc.style.setProperty("--helmet-width",hw+"px");
      focal=Math.min(W*(land?1.0:1.34),H*(land?2.25:1.25));
      eye={x:W*(land?.3:.5),y:H*(land?.48:.51)};
      rebuildPaper();
    }
    function rebuildPaper(){
      BG=document.createElement("canvas");BG.width=Math.round(W*ratio);BG.height=Math.round(H*ratio);
      const b=BG.getContext("2d");b.setTransform(ratio,0,0,ratio,0,0);
      b.fillStyle=paper;b.fillRect(0,0,W,H);
      const sun=b.createRadialGradient(W*.25,H*.08,20,W*.48,H*.51,Math.max(W,H)*.94);
      sun.addColorStop(0,"rgba(255,255,255,.70)");sun.addColorStop(.52,"rgba(255,255,255,.09)");sun.addColorStop(1,"rgba(123,121,102,.14)");b.fillStyle=sun;b.fillRect(0,0,W,H);
      b.strokeStyle="rgba(39,123,72,.052)";b.lineWidth=.68;b.beginPath();
      let k=29;for(let x=12;x<=W;x+=k){b.moveTo(x,0);b.lineTo(x,H)}for(let y=12;y<=H;y+=k){b.moveTo(0,y);b.lineTo(W,y)}b.stroke();
      b.fillStyle="rgba(59,66,57,.10)";
      for(let i=0;i<Math.min(3600,W*H/85);i++){
        const x=random(i+188)*W,y=random(i+2843)*H;
        b.globalAlpha=.1+random(i+942)*.25;b.fillRect(x,y,.45+random(i+98)*.9,.4+random(i+48)*.65);
      }
      b.globalAlpha=1;b.strokeStyle="rgba(38,54,47,.11)";b.lineWidth=.7;
      const m=16;/* clean cinematic bleed: no rectangular picture-frame border */
      b.strokeStyle="rgba(26,100,62,.35)";b.beginPath();
      const tick=Math.min(W,H)*.025;
      [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,dx,dy])=>{
        b.moveTo(x+dx*5,y);b.lineTo(x+dx*(5+tick),y);
        b.moveTo(x,y+dy*5);b.lineTo(x,y+dy*(5+tick));
      });b.stroke();
    }
    /* Perspectiva tridimensional uniforme para vigas, lajes e pilares. */
    function camera(t){
      const r=easeInOut(smooth(.65,3.55,t));yaw=-.2-.48*r;
      pitch=.1+.19*r;distance=17-3.1*r;
    }
    function project(x,y,z){
      const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
      const xx=x*cy+z*sy,zz=-x*sy+z*cy,yy=y*cp+zz*sp;
      const depth=-y*sp+zz*cp+distance,sc=focal/depth;
      return {x:eye.x+xx*sc,y:eye.y-yy*sc,z:depth,s:sc};
    }
    function l3(a,b){const p=project(...a),q=project(...b);ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);return[p,q];}
    function graphite(x1,y1,x2,y2,a=1,width=1.1,seed=1){
      const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);if(len<.2)return;
      let nx=-dy/len,ny=dx/len,off=(random(seed+20)-.5)*1.5;
      ctx.strokeStyle=ink;ctx.lineCap="round";ctx.lineWidth=width;ctx.globalAlpha=a;
      ctx.beginPath();ctx.moveTo(x1-nx*off-dx/len*2,y1-ny*off-dy/len*2);
      ctx.quadraticCurveTo((x1+x2)/2+nx*(random(seed+11)-.5)*2.7,(y1+y2)/2+ny*(random(seed+11)-.5)*2.7,x2+nx*off+dx/len*2,y2+ny*off+dy/len*2);ctx.stroke();
      ctx.globalAlpha=a*.27;ctx.lineWidth=.55;ctx.beginPath();ctx.moveTo(x1+nx*1.8,y1+ny*1.8);ctx.lineTo(x2+nx*1.25,y2+ny*1.25);ctx.stroke();
    }
    function line(x,y,X,Y,color=ink,alpha=1,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.globalAlpha=alpha;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke();}
    function node(x,y,s=1){ctx.strokeStyle="#2f5650";ctx.lineWidth=1;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(x,y,1.6*s,0,TAU);ctx.stroke();}

    function addMember(a,b,w=.13,order=0,kind="steel"){
      members.push({a,b,w,order,kind,id:members.length});
    }
    function initializeStructure(){
      const xx=[-4,-2,0,2,4],Z=[-1.1,1.1],low=.2,hi=2.65;
      for(const z of Z){
        for(let i=0;i<4;i++)addMember([xx[i],low,z],[xx[i+1],low,z],.17,i*.052);
        for(let i=1;i<3;i++)addMember([xx[i],hi,z],[xx[i+1],hi,z],.17,.28+i*.03);
        for(let i=1;i<4;i++)addMember([xx[i],low,z],[xx[i],hi,z],.135,.38+i*.035);
        addMember([-4,low,z],[-2,hi,z],.17,.18);
        addMember([4,low,z],[2,hi,z],.17,.21);
        addMember([-2,hi,z],[0,low,z],.12,.47);addMember([0,low,z],[2,hi,z],.12,.50);
        addMember([-2,low,z],[0,hi,z],.1,.57);addMember([0,hi,z],[2,low,z],.1,.59);
      }
      for(let i=0;i<5;i++)addMember([xx[i],low,-1.1],[xx[i],low,1.1],.1,.2+i*.04);
      for(let i=1;i<4;i++)addMember([xx[i],hi,-1.1],[xx[i],hi,1.1],.11,.48+i*.035);
      for(let i=0;i<4;i++){
        addMember([xx[i],low,-1.1],[xx[i+1],low,1.1],.065,.62+i*.028);
        addMember([xx[i],low,1.1],[xx[i+1],low,-1.1],.065,.65+i*.02);
      }
      let all=[];
      members.forEach(m=>{
        const split=m.kind==="steel"?4:3;
        for(let j=0;j<split;j++){
          const p=j/split,q=(j+1)/split;
          const lerp3=(a,b,f)=>a.map((v,i)=>mix(v,b[i],f));
          const a=lerp3(m.a,m.b,p),b=lerp3(m.a,m.b,q);
          const mid=a.map((v,i)=>(v+b[i])/2);
          all.push({a,b,mid,m,idx:all.length});
        }
      });
      // O corte começa nas extremidades da ponte e avança para as juntas centrais.
      all.sort((a,b)=>Math.abs(b.mid[0])-Math.abs(a.mid[0]) || a.idx-b.idx);
      sections=all.map((s,i)=>{
        const slot=i%10,ci=slot===9?0:1+((i*7)%9),tile=i%16;
        const red=ci===0;
        const release=red?5.32+random(i+63)*.25:4.25+i/all.length*1.15+random(i+13)*.11;
        const end=red?6.89:6.54+random(i+73)*.18;
        return {...s,ci,red,tile,release,end,id:i,curve:(random(i+51)-.5),wave:(random(i+54)-.5),angle:(random(i+88)-.5)*5.2};
      });
      shardData=Array.from({length:80},(_,i)=>({
        x:random(i*3+44),y:random(i*4+446),phase:random(i+71),v:random(i+53),d:random(i+503)
      }));
      dust=Array.from({length:96},(_,i)=>({
        x:random(i+880),y:random(i+991),z:random(i+1091),s:.45+random(i+442)*1.4,p:random(i+141)
      }));
    }
    /* Croqui inicial: cotas, eixos, hachuras e pontos de conexão. */
    function drafting(t){
      const show=ease(smooth(0,.65,t))*(1-smooth(2.75,4.6,t));
      if(show<.01)return;
      ctx.save();ctx.globalAlpha=show;
      let q=ease(smooth(.05,.93,t));
      ctx.strokeStyle=guide;ctx.lineWidth=.85;ctx.setLineDash([5,3]);ctx.beginPath();
      l3([-5.2,0,0],[5.2,0,0]);l3([0,-3.6,0],[0,4.1,0]);
      l3([-4.5,.2,-1.48],[4.5,.2,-1.48]);l3([-4.5,.2,1.48],[4.5,.2,1.48]);
      ctx.globalAlpha=show*.6*q;ctx.stroke();ctx.setLineDash([]);
      const pts=[[-4,.2,-1.1],[4,.2,-1.1],[-2,2.65,-1.1],[2,2.65,-1.1]];
      ctx.strokeStyle=ink;ctx.globalAlpha=show*.65*q;ctx.beginPath();
      pts.forEach(p=>{const a=project(...p);ctx.moveTo(a.x-4,a.y);ctx.lineTo(a.x+4,a.y);ctx.moveTo(a.x,a.y-4);ctx.lineTo(a.x,a.y+4)});ctx.stroke();
      // Linha de cota de 8 metros, escrita como anotação de croqui.
      const aa=project(-4,3.65,-1.3),bb=project(4,3.65,-1.3);
      const cota=ease(smooth(.4,1.2,t));
      line(aa.x,aa.y,mix(aa.x,bb.x,cota),mix(aa.y,bb.y,cota),guide,show*.73,1);
      for(const p of [aa,bb]){line(p.x-4,p.y+4,p.x+4,p.y-4,guide,show*.65,.8)}
      const cc=project(0,3.65,-1.3);ctx.globalAlpha=show*.65*cota;ctx.font="italic 13px Caveat,cursive";ctx.fillStyle=ink;ctx.textAlign="center";ctx.fillText("8,00 m",cc.x,cc.y-8);
      ctx.restore();
    }
    function ground(t){
      const a=ease(smooth(.2,1.25,t))*(1-smooth(4.55,5.55,t));if(a<.005)return;
      const p=project(-5.5,-3.2,0),q=project(5.5,-3.2,0);

      ctx.restore();
    }
    function transientRings(t){
      const a=filmAlpha(15.4,16.1,20.2,22.4,t);if(a<.004)return;
      ctx.save();ctx.translate(W*(land?.33:.50),H*(land?.49:.37));
      for(let i=0;i<4;i++){
        const p=clamp((t-15.5)*.33-i*.13),rad=(18+p*220)*Math.min(W,H)/390;
        ctx.globalAlpha=a*(1-p)*(.15-i*.025);ctx.strokeStyle=['#449fb5','#a48ac1','#d4a14d','#379b69'][i];ctx.lineWidth=1.3;
        ctx.beginPath();ctx.ellipse(0,0,rad,rad*.59,Math.sin(t*.32)*.06,0,TAU);ctx.stroke();
      }
      ctx.restore();
    }
    function finalAura(t){
      const a=filmAlpha(18,19.4,22.9,24.9,t);if(a<.004)return;
      const p=grid[0]||{x:W*.5,y:H*.3},r=sym.unit;
      ctx.save();let g=ctx.createRadialGradient(p.x,p.y,r*.1,p.x,p.y,r*4.9);
      g.addColorStop(0,`rgba(237,166,94,${a*.23})`);g.addColorStop(.34,`rgba(205,20,37,${a*.08})`);g.addColorStop(1,'rgba(205,20,37,0)');
      ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      for(let i=0;i<15;i++){
        let ang=i*TAU/15+t*.05,r0=r*(.72+random(i+456)*.35),r1=r*(1.35+random(i+211)*1.45);
        ctx.globalAlpha=a*(.18+.12*Math.sin(i+t));ctx.strokeStyle=i%3===0?'#d38b65':i%2?'#7bacab':'#c5a5cd';ctx.lineWidth=.65;
        ctx.beginPath();ctx.moveTo(p.x+Math.cos(ang)*r0,p.y+Math.sin(ang)*r0);ctx.lineTo(p.x+Math.cos(ang)*r1,p.y+Math.sin(ang)*r1);ctx.stroke();
      }
      ctx.restore();
    }
    function storyTitle(t){
      // Film-chapter slates, deliberately quiet and transient.
      const labels=[['I  /  CADERNO DE CAMPO',0.35,1.3,2.4,3.2],
        ['II  /  TOPOGRAFIA',4.3,5.0,6.2,6.9],
        ['III  /  A ESTRUTURA NASCE',8.1,8.7,10.6,11.4],
        ['IV  /  A MATÉRIA SE TRANSFORMA',16.0,16.7,18.4,19.1]];
      ctx.save();ctx.font=`${Math.max(9,Math.min(11,W*.027))}px ui-monospace,monospace`;ctx.textAlign='center';ctx.letterSpacing='1px';
      for(const [text,a,b,c,d] of labels){let alpha=filmAlpha(a,b,c,d,t);if(alpha<.01)continue;
        ctx.globalAlpha=alpha*.54;ctx.fillStyle='#455a55';ctx.fillText(text,W*.5,land?H*.92:H*.957);
      }ctx.restore();
    }
    function filmVignette(t){
      // Exposure changes and a single brief lens flare during steel assembly.
      const pulse=filmAlpha(10.65,10.85,11.05,11.38,t);
      const bridgeFlash=filmAlpha(14.4,14.7,15.05,15.4,t);
      const f=Math.max(pulse*.08,bridgeFlash*.075);
      if(f<.002)return;
      ctx.save();ctx.globalAlpha=f;ctx.fillStyle='#fff2d9';ctx.fillRect(0,0,W,H);ctx.restore();
    }
    function originalTime(t){
      // The helmet fall is *exactly* the original motion (mt .15-3.69).
      // Later scenes give the logo transformation and handwritten title
      // significantly more breathing room than the eight-second version.
      if(t<=7)return -2;
      if(t<=15)return (t-7)*.65;
      if(t<=20)return 5.2+(t-15)*.4;
      return Math.min(8,7.2+(t-20)*.25);
    }

    function riverLandscape(t){
      const a=filmAlpha(6.7,8.5,14.4,16.7,t);if(a<.004)return;
      ctx.save();ctx.globalAlpha=a;
      // Blue-hour horizon of a hypothetical river crossing; no location claim.
      const hz=H*(land?.49:.42);
      for(let layer=0;layer<3;layer++){
        const slope=layer*.11,shift=(t-7)*(.3+layer*.35),y=hz+H*(layer*.065);
        let colors=['rgba(125,156,147,.16)','rgba(74,151,153,.19)','rgba(58,130,141,.18)'];
        ctx.fillStyle=colors[layer];ctx.beginPath();ctx.moveTo(0,H);
        ctx.lineTo(0,y+H*.026);
        for(let px=0;px<=W+12;px+=12){
          const h=H*(.026+layer*.012)*Math.sin(px/W*PI*2.6+layer*2.8+shift*.012)+
                  H*.014*Math.sin(px/W*TAU*1.8+layer*.2);
          ctx.lineTo(px,y+h);
        }ctx.lineTo(W,H);ctx.closePath();ctx.fill();
      }
      // Riverbanks occupy only the silhouette, keeping truss readable.
      const shade=ctx.createLinearGradient(0,hz,0,H);
      shade.addColorStop(0,'rgba(66,170,179,.0)');shade.addColorStop(.6,'rgba(55,148,175,.08)');shade.addColorStop(1,'rgba(28,98,142,.13)');
      ctx.globalAlpha=a*.9;ctx.fillStyle=shade;ctx.fillRect(0,hz,W,H-hz);
      const sunx=W*.31,suny=H*.22;
      const light=ctx.createRadialGradient(sunx,suny,0,sunx,suny,Math.min(W,H)*.67);
      light.addColorStop(0,'rgba(255,190,94,.23)');light.addColorStop(.28,'rgba(255,216,134,.1)');light.addColorStop(1,'rgba(255,211,169,0)');
      ctx.globalAlpha=a;ctx.fillStyle=light;ctx.fillRect(0,0,W,H);
      // Sparse grass strokes on banks, multiple depths.
      ctx.globalAlpha=a*.20;ctx.strokeStyle='#417d72';ctx.lineWidth=.8;ctx.beginPath();
      for(let i=0;i<45;i++){
        const px=random(i+1331)*W,py=hz+H*(.09+random(i+441)*.37),len=3+random(i+63)*13;
        ctx.moveTo(px,py);ctx.quadraticCurveTo(px+len*.11,py-len*.45,px+(random(i+6)-.5)*len,py-len);
      }ctx.stroke();ctx.restore();
    }
    function pouringConcrete(t){
      const a=filmAlpha(8.0,8.65,10.4,11.5,t);if(a<.004)return;
      ctx.save();ctx.globalAlpha=a;
      // Flexible pump outlet followed by a continuous, non-Newtonian pour.
      const ex=W*(land?.62:.65),ey=H*.405,yy=H*.565;
      ctx.strokeStyle='#5b7073';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();
      ctx.moveTo(W*(land?.85:.98),H*.27);
      ctx.bezierCurveTo(W*.80,H*.20,W*.76,H*.36,ex,ey);ctx.stroke();
      ctx.strokeStyle='#c8d1ca';ctx.lineWidth=2;ctx.beginPath();
      ctx.moveTo(W*(land?.85:.98),H*.27);ctx.bezierCurveTo(W*.80,H*.20,W*.76,H*.36,ex,ey);ctx.stroke();
      const jet=ctx.createLinearGradient(ex,ey,ex+5,ey);jet.addColorStop(0,'#9a9c94');jet.addColorStop(.5,'#c4c8bb');jet.addColorStop(1,'#868f90');
      ctx.strokeStyle=jet;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(ex,ey);ctx.bezierCurveTo(ex+Math.sin(t*3)*5,ey+32,ex-3,yy-24,ex+2,yy);ctx.stroke();
      for(let i=0;i<17;i++){
        const life=(t*.85+random(i+514))%1,px=ex+(random(i+515)-.5)*33*life,py=yy+life*life*20;
        ctx.globalAlpha=a*(1-life)*.53;ctx.fillStyle=i%2?'#bfc0b4':'#909e9a';
        ctx.beginPath();ctx.arc(px,py,.7+random(i+516)*1.5,0,TAU);ctx.fill();
      }ctx.restore();
    }
    function draftingTools(t){
      const a=filmAlpha(1.25,2.15,4.2,5.2,t);if(a<.004)return;
      const x=land?W*.77:W*.72,y=land?H*.56:H*.73,sz=Math.min(W*.22,H*.13);
      ctx.save();ctx.translate(x,y);ctx.rotate(.12);ctx.globalAlpha=a*.45;
      // Steel compass for circles, resting on the notebook edge.
      ctx.strokeStyle='#687674';ctx.lineWidth=2.8;ctx.beginPath();ctx.moveTo(0,-sz*.5);ctx.lineTo(-sz*.36,sz*.38);ctx.moveTo(0,-sz*.5);ctx.lineTo(sz*.28,sz*.44);ctx.stroke();
      ctx.fillStyle='#b48750';ctx.beginPath();ctx.arc(0,-sz*.5,4,0,TAU);ctx.fill();
      ctx.lineWidth=1.2;ctx.strokeStyle='#e4b865';ctx.beginPath();ctx.arc(0,-sz*.5,8,PI*.16,PI*.86);ctx.stroke();
      lineF(-sz*.36,sz*.35,-sz*.4,sz*.47,'#3b4b4c',a*.7,2);
      lineF(sz*.28,sz*.43,sz*.3,sz*.47,'#3b4b4c',a*.7,2);
      ctx.restore();
    }
    function tideRipples(t){
      const a=filmAlpha(10.8,11.7,15.0,16.9,t);if(a<.004)return;
      ctx.save();ctx.globalAlpha=a*.35;
      for(let q=0;q<7;q++){
        let y=H*(.78+q*.029),x=W*(.15+random(q+299)*.74),l=18+q*4;
        ctx.beginPath();ctx.strokeStyle=q%2?'#68b1bd':'#e4be7e';ctx.lineWidth=.7;
        ctx.ellipse(x+(t-11)*(q%2?2:-2),y,l*(1+.05*Math.sin(t+q)),2.2,0,0,PI);ctx.stroke();
      }
      ctx.restore();
    }

    function paint(t){
      const mt=originalTime(t);
      ctx.globalAlpha=1;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.drawImage(BG,0,0,W,H);
      ctx.lineCap="round";ctx.lineJoin="round";
      cinematicWash(t);
      if(t<5.6)notebook(t);
      if(t>1.25&&t<5.2)draftingTools(t);
      if(t>3.35&&t<9.1){contourGrid(t);surveyTris(t);totalStation(t);}
      if(t>6.65&&t<16.8)riverLandscape(t);
      if(t>5.75&&t<16.4)fluidScene(t);
      if(t>10.7&&t<17)tideRipples(t);
      if(mt>=0){
        camera(mt);
        if(t>7.3&&t<15.7){craneBack(t);scaffold(t);}
        if(mt<5.3){bridge(mt);cinematicLight(mt);scanning(mt);}
        if(t>7&&t<15.8){concreteDetails(t);equipment(t);pouringConcrete(t);weldSparks(t,mt);surveyingAnnotations(t);}
        drawFragments(mt);brand(mt);
        moveHelmet(mt);typography(mt);
      }else{
        hc.style.opacity="0";identity.style.opacity="0";
      }
      if(t>11.7&&t<24)coloredDust(t);
      if(t>15.35&&t<22.6)transientRings(t);
      if(t>17.9&&t<25)finalAura(t);
      storyTitle(t);filmVignette(t);
      ctx.globalAlpha=1;
    }
    function tick(now){
      if(done)return;
      const ms=Math.max(0,now-inicio),t=Math.min(DURACAO/1000,ms/1000);
      try{paint(t);frameNo++;}catch(e){document.body.classList.add("static");done=true;return;}
      if(ms>=DURACAO){navegar();done=true;return;}
      requestAnimationFrame(tick);
    }
    initializeStructure();resize();
    window.addEventListener("resize",resize,{passive:true});
    document.addEventListener("visibilitychange",function(){if(document.hidden)return;if(performance.now()-inicio>=DURACAO)navegar();});
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
