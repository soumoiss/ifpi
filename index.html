<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eee7d7">
<title>IFPI Parnaíba · Moisés Pereira</title>
<style>
/* Configuração base do documento e fundo em papel artesanal */
html, body {
  margin: 0;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  background: #eee7d7;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

/* Tela final acessível e estática após conclusão ou ao pular */
#end {
  display: none;
  position: absolute;
  inset: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #eee7d7;
  color: #1d2c27;
  font-family: "Avenir Next", "Gill Sans", "Trebuchet MS", sans-serif;
  padding: 24px;
  box-sizing: border-box;
  opacity: 0;
  transition: opacity 0.45s ease;
}

#end.show {
  opacity: 1;
}

#end svg {
  width: 100px;
  height: 140px;
}

#end b {
  font-size: 26px;
  margin-top: 22px;
  font-weight: 600;
  color: #14532d;
}

#end span {
  font-size: 16px;
  margin-top: 4px;
  color: #1f7a3d;
}

#end i {
  font: italic 30px Georgia, serif;
  margin-top: 26px;
  color: #1b2d52;
}

#end u {
  font-size: 14px;
  margin-top: 8px;
  text-decoration: none;
  color: #1f5f8b;
}

/* Controles interativos discretos no canto inferior direito */
#ctl {
  position: absolute;
  right: max(12px, env(safe-area-inset-right));
  bottom: max(14px, env(safe-area-inset-bottom));
  display: flex;
  gap: 8px;
  z-index: 9;
}

#ctl button {
  font: 600 13px "Avenir Next", "Gill Sans", sans-serif;
  color: #2f3b38;
  background: rgba(238, 231, 215, 0.9);
  border: 1px solid #7d8a84;
  border-radius: 18px;
  padding: 9px 14px;
  min-width: 44px;
  min-height: 40px;
  cursor: pointer;
  transition: transform 0.15s ease, background-color 0.15s ease;
}

#ctl button:active {
  transform: scale(0.95);
}

#ctl button:hover {
  background: #e4dac4;
}

/* Botão de acesso ao SUAP exibido na conclusão */
#lk {
  display: none;
  position: absolute;
  left: 50%;
  bottom: max(68px, calc(env(safe-area-inset-bottom) + 56px));
  transform: translateX(-50%);
  z-index: 9;
  background: #2f9e41;
  color: #fff;
  font: 600 14px "Avenir Next", "Gill Sans", sans-serif;
  padding: 11px 22px;
  border-radius: 22px;
  text-decoration: none;
  box-shadow: 0 4px 12px rgba(47, 158, 65, 0.25);
  transition: transform 0.15s ease, background-color 0.15s ease;
}

#lk:hover {
  background: #268737;
}

@media (prefers-reduced-motion: reduce) {
  canvas, #ctl {
    display: none !important;
  }
  #end {
    display: flex;
    opacity: 1;
  }
  #lk {
    display: block;
  }
}
</style>
</head>
<body>

<!-- Canvas principal da animação em grafite e tinta -->
<canvas id="f" aria-hidden="true"></canvas>

<!-- Controles de velocidade, repetição e avanço -->
<div id="ctl">
  <button id="rp" aria-label="Repetir animação" title="Assistir novamente">↺</button>
  <button id="sp" aria-label="Alterar velocidade da animação" title="Velocidade">1×</button>
  <button id="sk" aria-label="Pular para tela final">Pular</button>
</div>

<!-- Link de destino SUAP -->
<a id="lk" href="https://suap.ifpi.edu.br/" target="_blank" rel="noopener noreferrer">Abrir SUAP</a>

<!-- Tela final vetorial acessível -->
<div id="end" role="status" aria-label="Instituto Federal do Piauí, Campus Parnaíba, Moisés Pereira, Engenharia Civil">
  <svg viewBox="0 0 94 132" aria-hidden="true">
    <g fill="#2f9e41">
      <rect x="32" width="27" height="27" rx="3"/>
      <rect x="64" width="27" height="27" rx="3"/>
      <rect y="32" width="27" height="27" rx="3"/>
      <rect x="32" y="32" width="27" height="27" rx="3"/>
      <rect y="64" width="27" height="27" rx="3"/>
      <rect x="32" y="64" width="27" height="27" rx="3"/>
      <rect x="64" y="64" width="27" height="27" rx="3"/>
      <rect y="96" width="27" height="27" rx="3"/>
      <rect x="32" y="96" width="27" height="27" rx="3"/>
    </g>
    <circle cx="13.5" cy="13.5" r="14.85" fill="#cd191e"/>
  </svg>
  <b>Instituto Federal</b>
  <span>do Piauí · Campus Parnaíba</span>
  <i>Moisés Pereira</i>
  <u>Engenharia Civil</u>
</div>

<script>
(() => {
  'use strict';

  // Duração total ajustada para 7.5 segundos (entre 7 e 8 segundos)
  const D = 7.5;
  const W = 480;
  const H = 850;
  const PI = Math.PI;
  const TAU = PI * 2;

  const $ = s => document.getElementById(s);
  const cv = $('f');
  const cx = cv.getContext('2d', { alpha: false });

  // Funções utilitárias de interpolação e ruído orgânico para traço manual
  const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const mx = (a, b, t) => a + (b - a) * t;
  const hs = n => {
    const x = Math.sin(n * 127.1 + 17.7) * 43758.5;
    return x - Math.floor(x);
  };
  const nz = (x, y, s) => Math.sin(x * 0.21 + y * 0.13 + s) * 0.7 + Math.sin(x * 0.07 - y * 0.19 + s * 2.1) * 0.6;

  // Paleta e tipografia originais
  const G = '#2f3b38';
  const BL = '#2d6277';
  const RD = '#cd191e';
  const FN = '"Avenir Next","Gill Sans","Trebuchet MS",sans-serif';
  const HF = '"Bradley Hand","Segoe Print","Noteworthy",cursive';

  let cw, ch, dpr, sc, ox, oy;
  let paper, raf = 0, finished = false;
  let T = 0, last = 0, spd = 1;
  const L = [];

  // ---------- Lista de desenho: cada traço nasce com mão trêmula e progressiva ----------
  function ln(P, a, d, o = {}) {
    if (o.v) {
      const [x, y] = P[0];
      const [X, Y] = P[P.length - 1];
      const l = Math.hypot(X - x, Y - y) || 1;
      const ux = (X - x) / l * o.v;
      const uy = (Y - y) / l * o.v;
      P = [[x - ux, y - uy], ...P.slice(1, -1), [X + ux, Y + uy]];
    }
    const R = [];
    const j = o.j ?? 0.7;
    const s = L.length * 0.37;
    for (let i = 0; i < P.length - 1; i++) {
      const [x, y] = P[i];
      const [X, Y] = P[i + 1];
      const n = Math.max(1, Math.ceil(Math.hypot(X - x, Y - y) / 5));
      for (let k = 0; k < n; k++) {
        const u = k / n;
        const px = mx(x, X, u);
        const py = mx(y, Y, u);
        R.push([px + nz(px, py, s) * j, py + nz(py, px, s + 4) * j]);
      }
    }
    R.push(P[P.length - 1]);
    L.push({
      k: 0,
      R,
      a,
      d,
      w: o.w || 1,
      c: o.c || G,
      o: o.o ?? 1,
      da: o.da,
      p2: o.p2 ?? 1
    });
  }

  const fl = (P, a, d, c, o = 1) => L.push({ k: 1, R: P, a, d, c, o });
  const tx = (q, x, y, a, d = 0.85, o = {}) => L.push({
    k: 2,
    q,
    x,
    y,
    a,
    d,
    z: o.z || 10,
    c: o.c || BL,
    al: o.al || 'left',
    o: o.o ?? 1,
    fn: o.fn || HF,
    s: o.s || '',
    ls: o.ls || 0
  });

  const el = (x, y, rx, ry, a0 = 0, a1 = TAU, n = 28) => Array.from({ length: n + 1 }, (_, i) => {
    const a = a0 + (a1 - a0) * i / n;
    return [x + rx * Math.cos(a), y + ry * Math.sin(a)];
  });

  const rr = (x, y, w, h, r) => [
    ...el(x + w - r, y + r, r, r, -PI / 2, 0, 4),
    ...el(x + w - r, y + h - r, r, r, 0, PI / 2, 4),
    ...el(x + r, y + h - r, r, r, PI / 2, PI, 4),
    ...el(x + r, y + r, r, r, PI, PI * 1.5, 4),
    [x + w - r, y]
  ];

  // ---------- Construção da cena: Logo do IFPI, textos e assinatura ----------
  // Halos suaves de fundo em aquarela (verde atrás da logo e azul atrás da assinatura)
  fl(el(240, 214, 185, 135, 0, TAU, 40), 0.15, 1.5, '#bfe6c9', 0.4);
  fl(el(240, 596, 190, 52, 0, TAU, 40), 3.3, 1.3, '#cfe4f4', 0.5);

  // Geometria oficial da marca do IFPI (9 módulos verdes + círculo superior esquerdo vermelho)
  const lx = 158;
  const ly = 100;
  const U = 48;
  const ST = 57.6;
  const CELLS = [
    [0, 0, 1], [1, 0], [2, 0],
    [0, 1],    [1, 1],
    [0, 2],    [1, 2], [2, 2],
    [0, 3],    [1, 3]
  ];
  const GN = ['#2f9e41', '#47b950', '#25873a'];

  // Cronograma mais lento e detalhado para os 10 módulos da logo (0.25s a ~3.3s)
  CELLS.forEach(([c, r, red], i) => {
    const x = lx + c * ST;
    const y = ly + r * ST;
    const a = 0.25 + i * 0.21;

    if (red) {
      const o = el(x + 24, y + 24, 26.4, 26.4, 0, TAU, 40);
      ln(o, a, 0.78, { c: '#5c1d1d', w: 1.2 });
      fl(o, a + 0.45, 0.75, RD);
    } else {
      const o = rr(x, y, U, U, 5);
      ln(o, a, 0.78, { w: 1.2 });
      fl(o, a + 0.45, 0.75, GN[(c + r) % 3]);
      // Hachuras diagonais internas feitas a lápis em cada bloco
      for (let k = 1; k < 5; k++) {
        ln(
          [[x + 1.5, y + k * 9], [x + k * 9, y + 1.5]],
          a + 0.85 + k * 0.06,
          0.3,
          { c: '#173d1e', w: 0.8, o: 0.45, j: 0.3 }
        );
      }
    }
  });

  // Textos institucionais e filete dourado (2.3s a 4.1s)
  tx('Instituto Federal', 240, 408, 2.35, 0.9, { z: 27, c: '#14532d', al: 'center', fn: FN, s: '600 ' });
  tx('do Piauí', 240, 436, 2.75, 0.85, { z: 18, c: '#1f7a3d', al: 'center', fn: FN });
  tx('Campus Parnaíba', 240, 462, 3.15, 0.85, { z: 14, c: '#b3202a', al: 'center', fn: FN, ls: 3 });
  ln([[186, 474], [294, 472]], 3.55, 0.65, { c: '#d9a21b', w: 1.6 });

  // Curso exibido após a assinatura (6.2s a 7.1s)
  tx('Engenharia Civil', 240, 668, 6.15, 0.95, { z: 15, c: '#1f5f8b', al: 'center', fn: 'Georgia,serif', s: 'italic ' });

  // ---------- Textura artesanal do papel ----------
  function mkPaper() {
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const g = c.getContext('2d');

    g.fillStyle = '#eee7d7';
    g.fillRect(0, 0, W, H);

    // Granulação sutil da celulose
    for (let i = 0; i < 4200; i++) {
      g.fillStyle = hs(i) > 0.5 ? 'rgba(255,255,255,.07)' : 'rgba(110,90,60,.06)';
      g.fillRect(hs(i * 3) * W, hs(i * 7) * H, 1 + hs(i * 5) * 2, 1);
    }

    // Grade milimetrada quase imperceptível
    g.strokeStyle = 'rgba(60,110,120,.055)';
    g.lineWidth = 0.6;
    for (let x = 0; x < W; x += 24) {
      g.beginPath();
      g.moveTo(x, 0);
      g.lineTo(x, H);
      g.stroke();
    }
    for (let y = 0; y < H; y += 24) {
      g.beginPath();
      g.moveTo(0, y);
      g.lineTo(W, y);
      g.stroke();
    }

    // Fibras orgânicas do papel
    g.strokeStyle = 'rgba(120,95,60,.05)';
    for (let i = 0; i < 380; i++) {
      const x = hs(i * 9) * W;
      const y = hs(i * 13) * H;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + hs(i * 2) * 16 - 8, y + hs(i * 4) * 8 - 4);
      g.stroke();
    }

    // Vinheta suave nas bordas
    const v = g.createRadialGradient(240, 425, 260, 240, 425, 560);
    v.addColorStop(0, 'rgba(120,100,70,0)');
    v.addColorStop(1, 'rgba(120,100,70,.14)');
    g.fillStyle = v;
    g.fillRect(0, 0, W, H);

    return c;
  }

  // ---------- Desenho do lápis/caneta acompanhando a ponta do traço ativo ----------
  function pen(x, y) {
    cx.save();
    cx.translate(x, y);
    cx.rotate(-1);
    // Corpo do lápis
    cx.fillStyle = '#c9922f';
    cx.fillRect(16, -4.5, 74, 9);
    // Ponta de madeira apontada
    cx.fillStyle = '#e8d2a6';
    cx.beginPath();
    cx.moveTo(16, -4.5);
    cx.lineTo(0, 0);
    cx.lineTo(16, 4.5);
    cx.fill();
    // Grafite
    cx.fillStyle = '#2b3330';
    cx.beginPath();
    cx.moveTo(4, -1.5);
    cx.lineTo(0, 0);
    cx.lineTo(4, 1.5);
    cx.fill();
    // Virola metálica e borracha
    cx.fillStyle = '#8d949a';
    cx.fillRect(90, -4.5, 10, 9);
    cx.fillStyle = '#d98f8f';
    cx.fillRect(100, -4.5, 6, 9);
    cx.restore();
  }

  // ---------- Assinatura manuscrita "Moisés Pereira" ----------
  const GL = {
    M: { a: 41, p: [[0, 62], [4, 30], [9, 6], [12, 5], [14, 20], [16, 44], [19, 56], [22, 40], [27, 12], [31, 6], [34, 16], [35, 42], [38, 54], [41, 52]] },
    o: { a: 26, p: [[3, 42], [8, 34], [14, 32], [19, 38], [19, 50], [14, 59], [8, 57], [6, 48], [10, 38], [17, 35], [22, 44], [26, 52]] },
    i: { a: 17, p: [[4, 40], [7, 33], [8, 44], [9, 54], [12, 59], [17, 52]] },
    s: { a: 26, p: [[4, 44], [9, 31], [15, 30], [16, 35], [8, 43], [6, 50], [11, 58], [18, 59], [22, 54], [26, 52]] },
    e: { a: 24, p: [[8, 48], [16, 42], [19, 36], [15, 32], [10, 36], [10, 46], [14, 54], [19, 58], [24, 52]] },
    r: { a: 22, p: [[4, 40], [6, 33], [7, 42], [9, 50], [12, 42], [17, 35], [22, 40]] },
    a: { a: 28, p: [[6, 42], [13, 34], [17, 38], [16, 50], [11, 58], [6, 55], [7, 46], [13, 40], [19, 38], [20, 48], [23, 56], [28, 52]] },
    P: { a: 22, p: [[0, 62], [3, 36], [6, 8], [12, 3], [20, 7], [22, 16], [16, 25], [8, 29], [4, 30], [3, 44], [2, 56], [8, 58], [16, 54], [22, 52]] }
  };

  function crs(P, n = 7) {
    const o = [];
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[Math.max(0, i - 1)];
      const b = P[i];
      const c = P[i + 1];
      const d = P[Math.min(P.length - 1, i + 2)];
      for (let k = 0; k < n; k++) {
        const t = k / n;
        const t2 = t * t;
        const t3 = t2 * t;
        const f = j => 0.5 * (
          2 * b[j] +
          (-a[j] + c[j]) * t +
          (2 * a[j] - 5 * b[j] + 4 * c[j] - d[j]) * t2 +
          (-a[j] + 3 * b[j] - 3 * c[j] + d[j]) * t3
        );
        o.push([f(0), f(1)]);
      }
    }
    o.push(P[P.length - 1]);
    return o;
  }

  function word(str, ox) {
    const pts = [];
    const ex = [];
    let x = ox;
    for (const ch of str) {
      const g = GL[ch === 'é' ? 'e' : ch];
      for (const q of g.p) pts.push([x + q[0], q[1]]);
      if (ch === 'i') ex.push([[x + 4, 20], [x + 5.5, 21.5], [x + 7, 23]]);
      if (ch === 'é') ex.push([[x + 8, 24], [x + 16, 16]]);
      x += g.a;
    }
    return { pts, ex };
  }

  const w1 = word('Moisés', 0);
  const w2 = word('Pereira', 181);
  const SS = 1.15;

  const SG = [
    [w1.pts, 0, 0.40],
    [w1.ex[0], 0.41, 0.43],
    [w1.ex[1], 0.44, 0.47],
    [w2.pts, 0.50, 0.84],
    [w2.ex[0], 0.85, 0.87],
    [[[340, 52], [346, 66], [300, 78], [200, 84], [100, 84], [30, 78]], 0.88, 1]
  ].map(([P, a, b], si) => {
    const q = crs(P, P.length > 4 ? 7 : 3).map(([x, y]) => [
      36 + (x + (60 - y) * 0.2) * SS + nz(x, y, si) * 0.5,
      545 + y * SS + nz(y, x, si + 3) * 0.5
    ]);
    const n = q.length;
    return {
      q,
      a,
      b,
      w: q.map((_, i) => {
        const v = i ? q[i][1] - q[i - 1][1] : 0;
        const tp = n < 8 ? 1 : Math.min(1, i / 5, (n - 1 - i) / 5);
        return SS * (1.3 + 1.5 * cl(v / 3 + 0.3, 0, 1) + 0.25 * Math.sin(i * 0.7)) * (0.35 + 0.65 * tp);
      })
    };
  });

  // Assinatura acontece de forma pausada e legível entre 3.7s e 6.4s (2.7s de duração)
  function sig(t) {
    const tn = cl((t - 3.7) / 2.7);
    if (tn <= 0) return null;

    cx.strokeStyle = '#1b2d52';
    cx.lineCap = 'round';
    cx.globalAlpha = 1;
    let tipP = null;

    for (const s of SG) {
      const p = cl((tn - s.a) / (s.b - s.a));
      if (p <= 0) continue;
      const n = Math.floor(p * (s.q.length - 1));
      for (let i = 1; i <= n; i++) {
        cx.lineWidth = s.w[i];
        cx.beginPath();
        cx.moveTo(s.q[i - 1][0], s.q[i - 1][1]);
        cx.lineTo(s.q[i][0], s.q[i][1]);
        cx.stroke();
      }
      if (p < 1) tipP = s.q[n];
    }

    return tipP;
  }

  // ---------- Renderização de cada quadro ----------
  function paint(t) {
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.fillStyle = '#eee7d7';
    cx.fillRect(0, 0, cw, ch);

    cx.save();
    cx.translate(ox, oy);
    cx.scale(sc, sc);

    // Fundo de papel texturizado
    cx.drawImage(paper, 0, 0, W, H);
    cx.lineCap = 'round';
    cx.lineJoin = 'round';

    let tp = null;
    let ta = -1;

    for (const e of L) {
      const al = e.o;
      const p = cl((t - e.a) / e.d);
      if (p <= 0 || al < 0.01) continue;

      if (e.k === 0) {
        const R = e.R;
        const pos = p * (R.length - 1);
        const n = Math.min(R.length - 1, pos | 0);
        const fr = pos - n;

        cx.strokeStyle = e.c;
        cx.setLineDash(e.da || []);

        // Dupla passada de grafite para realismo artesanal
        for (let ps = 0; ps < (e.p2 === 0 ? 1 : 2); ps++) {
          cx.globalAlpha = al * (ps ? 0.4 : 1);
          cx.lineWidth = e.w * (ps ? 0.55 : 1);
          const d = ps * 0.7;
          cx.beginPath();
          cx.moveTo(R[0][0] + d, R[0][1] + d * 0.6);
          for (let i = 1; i <= n; i++) {
            cx.lineTo(R[i][0] + d, R[i][1] + d * 0.6);
          }
          if (fr && n < R.length - 1) {
            cx.lineTo(
              mx(R[n][0], R[n + 1][0], fr) + d,
              mx(R[n][1], R[n + 1][1], fr) + d * 0.6
            );
          }
          cx.stroke();
        }

        if (p < 1 && e.w < 4 && e.o >= 0.5 && e.a > ta) {
          ta = e.a;
          tp = R[n];
        }
      } else if (e.k === 1) {
        cx.globalAlpha = al * p;
        cx.fillStyle = e.c;
        cx.beginPath();
        cx.moveTo(e.R[0][0], e.R[0][1]);
        for (let i = 1; i < e.R.length; i++) {
          cx.lineTo(e.R[i][0], e.R[i][1]);
        }
        cx.fill();
      } else {
        cx.globalAlpha = al * p;
        cx.font = e.s + e.z + 'px ' + e.fn;
        cx.fillStyle = e.c;
        cx.textAlign = e.al;
        cx.letterSpacing = e.ls + 'px';
        cx.fillText(e.q, e.x, e.y);
      }
    }

    cx.setLineDash([]);
    cx.globalAlpha = 1;

    // Desenha assinatura manuscrita e prioriza o lápis nela quando estiver escrevendo
    const sigTip = sig(t);
    const activeTip = sigTip || tp;

    if (activeTip && t < D - 0.25) {
      pen(activeTip[0], activeTip[1]);
    }

    cx.restore();
  }

  // ---------- Redimensionamento fluido ----------
  function resize() {
    cw = innerWidth;
    ch = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = (cw * dpr) | 0;
    cv.height = (ch * dpr) | 0;
    sc = Math.min(cw / W, ch / H);
    ox = (cw - W * sc) / 2;
    oy = (ch - H * sc) / 2;
    if (paper) paint(T);
  }

  // ---------- Finalização e reinício interativo ----------
  function showEnd() {
    if (finished) return;
    finished = true;
    cancelAnimationFrame(raf);
    paint(D);
    const endEl = $('end');
    endEl.style.display = 'flex';
    requestAnimationFrame(() => endEl.classList.add('show'));
    $('lk').style.display = 'block';
    $('sk').style.display = 'none';
  }

  function replay() {
    cancelAnimationFrame(raf);
    finished = false;
    T = 0;
    last = performance.now();
    const endEl = $('end');
    endEl.classList.remove('show');
    endEl.style.display = 'none';
    $('lk').style.display = 'none';
    $('sk').style.display = 'inline-block';
    raf = requestAnimationFrame(tick);
  }

  const tick = now => {
    if (finished) return;
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    T = Math.min(D, T + dt * spd);

    try {
      paint(T);
    } catch (e) {
      console.warn(e);
      showEnd();
      return;
    }

    if (T >= D) {
      setTimeout(showEnd, 350);
      return;
    }
    raf = requestAnimationFrame(tick);
  };

  // ---------- Inicialização ----------
  try {
    paper = mkPaper();
    resize();
    addEventListener('resize', resize, { passive: true });

    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      showEnd();
      return;
    }

    $('sp').onclick = () => {
      spd = spd === 1 ? 2 : spd === 2 ? 4 : 1;
      $('sp').textContent = spd + '×';
    };
    $('sk').onclick = showEnd;
    $('rp').onclick = replay;

    last = performance.now();
    raf = requestAnimationFrame(tick);
  } catch (e) {
    console.warn(e);
    showEnd();
  }
})();
</script>
</body>
</html>
