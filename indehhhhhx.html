<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFPI • Splash</title>

<!-- Fonte Premium -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   🎨 IDENTIDADE VISUAL — PREMIUM
========================================================= */
:root{
  --green-1:#18D26B;
  --green-2:#10B65A;
  --green-3:#0C9649;
  --green-4:#08773A;

  --red:#D50000;

  --text-dark:#111111;
  --text-muted:#2F2F2F;
  --bg:#ffffff;
}

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  height:100vh;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* =========================================================
   CONTAINER
========================================================= */
.container{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* =========================================================
   LOGO IF
========================================================= */
.logo{
  display:grid;
  grid-template-columns:repeat(3,36px);
  grid-template-rows:repeat(4,36px);
  gap:12px;
  margin-bottom:38px;
  position:relative;
}

/* BLOCOS */
.block{
  width:36px;
  height:36px;
  border-radius:10px;

  opacity:0;

  transform:
  translate(var(--x),var(--y))
  scale(.35)
  rotate(-12deg);

  animation:assemble 2.2s cubic-bezier(.22,1,.36,1) forwards;

  will-change:transform,opacity;

  box-shadow:
  0 8px 22px rgba(0,0,0,.16),
  inset 0 1px 0 rgba(255,255,255,.28);
}

.g1{background:var(--green-1);}
.g2{background:var(--green-2);}
.g3{background:var(--green-3);}
.g4{background:var(--green-4);}

.circle{
  background:var(--red);
  border-radius:50%;
}

.empty{
  visibility:hidden;
}

/* ANIMAÇÃO */
.block:nth-child(1){--x:-120px;--y:-160px;animation-delay:.30s;}
.block:nth-child(2){--x:180px;--y:-120px;animation-delay:.45s;}
.block:nth-child(3){--x:-160px;--y:80px;animation-delay:.60s;}
.block:nth-child(4){--x:140px;--y:140px;animation-delay:.75s;}
.block:nth-child(5){--x:-200px;--y:0;animation-delay:.90s;}
.block:nth-child(7){--x:200px;--y:-40px;animation-delay:1.05s;}
.block:nth-child(8){--x:-140px;--y:160px;animation-delay:1.20s;}
.block:nth-child(9){--x:160px;--y:-160px;animation-delay:1.35s;}
.block:nth-child(10){--x:-180px;--y:40px;animation-delay:1.50s;}
.block:nth-child(11){--x:120px;--y:180px;animation-delay:1.65s;}

@keyframes assemble{
  to{
    opacity:1;
    transform:translate(0,0) scale(1) rotate(0deg);
  }
}

/* =========================================================
   TEXTOS
========================================================= */

h1{
  font-size:.95rem;
  font-weight:600;
  letter-spacing:.08em;
  color:#111;

  opacity:0;
  transform:translateY(12px);

  animation:textIn .8s ease forwards;
  animation-delay:3.2s;
}

h2{
  margin-top:7px;

  font-size:1.08rem;
  font-weight:700;
  color:var(--green-3);

  opacity:0;
  transform:translateY(12px);

  animation:textIn .8s ease forwards;
  animation-delay:3.45s;
}

/* =========================================================
   M. P. SANTOS
========================================================= */

.aluno{

  margin-top:24px;

  font-family:"Cinzel",serif;

  font-size:1.12rem;

  font-weight:700;

  letter-spacing:.08em;

  color:#111;

  text-shadow:
  0 1px 0 rgba(255,255,255,.8),
  0 1px 8px rgba(0,0,0,.08);

  opacity:0;

  transform:translateY(12px);

  animation:textIn .8s ease forwards;

  animation-delay:3.8s;
}

@keyframes textIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================================================
   LOADER
========================================================= */

.loader{

  margin-top:38px;

  width:42px;
  height:42px;

  border-radius:50%;

  border:3px solid rgba(0,0,0,.08);

  border-top:3px solid var(--green-2);

  animation:spin 1.1s linear infinite;

  opacity:0;

  animation-delay:4.2s;

  animation-fill-mode:forwards;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* RESPONSIVO */
@media(max-width:420px){

.logo{
transform:scale(.92);
}

h1{
font-size:.88rem;
}

.aluno{
font-size:1rem;
}

}
</style>
</head>

<body>

<div class="container">

<div class="logo">

<div class="block circle"></div>
<div class="block g1"></div>
<div class="block g2"></div>

<div class="block g2"></div>
<div class="block g3"></div>
<div class="empty"></div>

<div class="block g3"></div>
<div class="block g4"></div>
<div class="block g2"></div>

<div class="block g4"></div>
<div class="block g3"></div>
<div class="empty"></div>

</div>

<h1>INSTITUTO FEDERAL DE EDUCAÇÃO, CIÊNCIA E TECNOLOGIA</h1>

<h2>Piauí</h2>

<div class="aluno">M. P. Santos • Engenharia Civil</div>

<div class="loader"></div>

</div>

<script>
setTimeout(() => {
  window.location.href = "https://suap.ifpi.edu.br/";
}, 7000);
</script>

</body>
</html>
