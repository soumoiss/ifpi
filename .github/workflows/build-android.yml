name: Gerar APK IFPI Parnaíba
on:
  push:
    branches: [android-webview-app]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK Android 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK
        run: cd android && gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk IFPI-Parnaiba-WebView.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: IFPI-Parnaiba-WebView
          path: IFPI-Parnaiba-WebView.apk
      - name: Publicar APK na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ifpi-webview-v1 >/dev/null 2>&1 || gh release create ifpi-webview-v1 --target "${GITHUB_SHA}" --title 'IFPI Parnaíba — Android WebView v1.0' --notes 'APK Android 8+ com navegação interna, mídia, arquivos, câmera e microfone.'
          gh release upload ifpi-webview-v1 IFPI-Parnaiba-WebView.apk --clobber
